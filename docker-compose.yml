services:
  lexitag:
    image: lokeshsg/lexitag:latest
    container_name: lexitag
    ports:
      - "3030:3030"
    env_file: .env
    environment:
      - MUSIC_DIR=/app/music
      - DATA_DIR=/app/data
    volumes:
      - ./music:/app/music # Mount local music library
      - ./data:/app/data # Persist SQLite database
    restart: unless-stopped
    # Access the UI at http://localhost:3030
